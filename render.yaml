# Render Blueprint — https://render.com/docs/blueprint-spec
# Note: on the free plan the filesystem is ephemeral, so the SQLite
# database resets on redeploy. Attach a persistent disk on a paid plan
# and set DATA_DIR to the mount path.
services:
  - type: web
    name: duha
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: auto
